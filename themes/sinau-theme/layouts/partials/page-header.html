{{/*
  PAGE HEADER — Menampilkan judul halaman + share icons
  Data source: .Site.Params.pageTitle (homepage) atau .Title (halaman lain)
*/}}
<section class="page-header">
  <h1 class="page-title">
    {{- if .IsHome -}}
      {{ .Site.Params.pageTitle | default .Site.Title }}
    {{- else -}}
      {{ .Title }}
    {{- end -}}
  </h1>
  <div class="share-icons">
    <span title="Copy link">🔗</span>
    <span title="Share">📤</span>
  </div>
</section>
