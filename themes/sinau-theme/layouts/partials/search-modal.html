<div id="search-modal" class="search-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: flex-start; padding-top: 50px;">
  <div class="search-modal-content" style="background: white; width: 90%; max-width: 600px; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <div class="search-header" style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="text" id="search-input" placeholder="Ketik untuk mencari (Judul, Kategori...)" autocomplete="off" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      <button id="close-search" style="padding: 10px 15px; background: #eee; border: none; border-radius: 4px; cursor: pointer;">✖ Tutup</button>
    </div>
    <div class="search-results-container" style="max-height: 60vh; overflow-y: auto;">
      <ul id="search-results" style="list-style: none; padding: 0; margin: 0;">
        <!-- Hasil pencarian akan diinjeksi via JavaScript -->
      </ul>
      <p id="search-empty" style="display:none; text-align:center; padding:20px;">Pencarian tidak ditemukan.</p>
    </div>
  </div>
</div>
