# baseURL sengaja dikosongkan. 
# Akan di-override oleh argumen CLI (-b) atau variabel HUGO_BASEURL Netlify
baseURL = ''
languageCode = 'id'
title = 'sinau-theme'
theme = 'sinau-theme'

# Pagination
paginate = 6

# Main sections (untuk query .Site.RegularPages)
[params]
  description = "Catatan Teknis — Linux, DevOps, dan Self-Hosting"
  
  # Disqus dikosongkan. 
  # Akan di-override oleh env var netlify HUGO_PARAMS_DISQUSSHORTNAME
  disqusshortname = ''
  
  author = "alex"
  mainSections = ["posts"]

  # Technical SEO & Analytics
  # Isi ID/Domain untuk mengaktifkan platform analitik pilihan Anda.
  [params.analytics]
    [params.analytics.umami]
      id     = "" # Masukkan Website ID Umami
      server = "https://analytics.umami.is" # Opsional (self-hosted)
    [params.analytics.plausible]
      domain = "" # Masukkan Domain (contoh: domain.com)
      server = "https://plausible.io" # Opsional (self-hosted)
    [params.analytics.google]
      id     = "" # Masukkan Gtag ID (contoh: G-XXXXXXXXXX)




  # Page Header
  pageTitle = "Catatan Teknis — Linux, DevOps, dan Self-Hosting"

  # Newsletter CTA
  [params.newsletter]
    title = "Ikuti Catatan Teknis."
    description = "Dapatkan notifikasi tulisan terbaru langsung via RSS atau email."
    buttonText = "Langganan"
    placeholder = "email@kamu.com"

  # Footer
  [params.footer]
    logo = "sinau-theme."
    copyright = "sinau-theme. Blog teknis pribadi. Dibuat dengan Hugo."

  # Social Links (dipakai di navbar & footer)
  [[params.social]]
    name = "Twitter"
    url = "https://twitter.com/"
    icon = "brand-twitter"

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/"
    icon = "brand-github"

# Menu Utama
[[menus.main]]
  name = 'Catatan'
  pageRef = '/posts'
  weight = 10

[[menus.main]]
  name = 'Kategori'
  pageRef = '/categories'
  weight = 20

[[menus.main]]
  name = 'Series'
  pageRef = '/series'
  weight = 30

[[menus.main]]
  name = 'Arsip'
  pageRef = '/arsip'
  weight = 40

[[menus.main]]
  name = 'Tentang'
  pageRef = '/tentang'
  weight = 50

# Taxonomies
[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

# Markdown Configuration
[markup]
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
  [markup.highlight]
    lineNos = true
    noClasses = false
    style = "github"

# Authors Configuration (for UI Stress Test)
[[params.authors]]
  id = "alex"
  name = "Alex Rivera"
  bio = "Cloud Architect & Open Source Enthusiast. Loves brewing coffee and automating everything with Go."
  avatar = "https://i.pravatar.cc/150?u=alex"
  github = "https://github.com/alex"
  linkedin = "https://linkedin.com/in/alex"

[[params.authors]]
  id = "sarah"
  name = "Sarah Miller"
  bio = "Frontend Engineer."
  avatar = "https://i.pravatar.cc/150?u=sarah"
  twitter = "https://twitter.com/sarah"

[[params.authors]]
  id = "budi"
  name = "Budi Santoso"
  bio = "DevOps Specialist specializing in Kubernetes and CI/CD pipelines. A strong advocate for infrastructure as code and reliable systems architecture. When not coding, Budi enjoys mountain hiking and photography, capturing the natural beauty of the Indonesian archipelago."
  avatar = "https://i.pravatar.cc/150?u=budi"

# Output Formats
[outputs]
  home = ["HTML", "RSS", "JSON"]
