baseURL = ''
theme = 'sinau-theme'

# Multilingual Configuration
defaultContentLanguage = 'id'
defaultContentLanguageInSubdir = false # ID di root (/), EN di subfolder (/en/)

[languages]
  [languages.id]
    languageCode = 'id'
    languageName = 'ID'
    weight = 1
    title = 'sinau-theme.'
    [languages.id.params]
      description = "Catatan Teknis — Linux, DevOps, dan Self-Hosting"
      pageTitle = "Catatan Teknis — Linux, DevOps, dan Self-Hosting"
      # Newsletter CTA (ID)
      [languages.id.params.newsletter]
        title = "Ikuti Catatan Teknis."
        description = "Dapatkan notifikasi tulisan terbaru langsung via RSS atau email."
        buttonText = "Langganan"
        placeholder = "email@kamu.com"
      # Footer (ID)
      [languages.id.params.footer]
        logo = "sinau-theme."
        copyright = "sinau-theme. Blog teknis pribadi. Dibuat dengan Hugo."

  [languages.en]
    languageCode = 'en'
    languageName = 'EN'
    weight = 2
    title = 'sinau-theme.'
    [languages.en.params]
      description = "Technical Notes — Linux, DevOps, and Self-Hosting"
      pageTitle = "Technical Notes — Linux, DevOps, and Self-Hosting"
      # Newsletter CTA (EN)
      [languages.en.params.newsletter]
        title = "Follow Tech Notes."
        description = "Get notified of the latest posts directly via RSS or email."
        buttonText = "Subscribe"
        placeholder = "email@you.com"
      # Footer (EN)
      [languages.en.params.footer]
        logo = "sinau-theme."
        copyright = "sinau-theme. Personal technical blog. Built with Hugo."

# Pagination
paginate = 6

[params]
  author = "alex"
  mainSections = ["posts"]
  disqusshortname = ''

  # Technical SEO & Analytics
  # Isi ID/Domain untuk mengaktifkan platform analitik pilihan Anda.
  [params.analytics]
    [params.analytics.umami]
      id     = "" # Masukkan Website ID Umami
      server = "https://analytics.umami.is" # Opsional (self-hosted)
    [params.analytics.plausible]
      domain = "" # Masukkan Domain (contoh: domain.com)
      server = "https://plausible.io" # Opsional (self-hosted)
    [params.analytics.google]
      id     = "" # Masukkan Gtag ID (contoh: G-XXXXXXXXXX)




  # Page Header
  pageTitle = "Catatan Teknis — Linux, DevOps, dan Self-Hosting"

  # Social Links (dipakai di navbar & footer)
  [[params.social]]
    name = "Twitter"
    url = "https://twitter.com/"
    icon = "brand-twitter"

  [[params.social]]
    name = "GitHub"
    url = "https://github.com/"
    icon = "brand-github"

# Menu Utama
[[menus.main]]
  identifier = 'catatan'
  name = 'Catatan'
  pageRef = '/posts'
  weight = 10

[[menus.main]]
  identifier = 'archive'
  name = 'Archive'
  pageRef = '/archive'
  weight = 15

[[menus.main]]
  identifier = 'categories'
  name = 'Kategori'
  pageRef = '/categories'
  weight = 20

[[menus.main]]
  identifier = 'series'
  name = 'Series'
  pageRef = '/series'
  weight = 30

[[menus.main]]
  identifier = 'about'
  name = 'Tentang'
  pageRef = '/tentang'
  weight = 50

# Taxonomies
[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

# Markdown Configuration
[markup]
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
  [markup.highlight]
    lineNos = true
    noClasses = false
    style = "github"

# Authors Configuration (for UI Stress Test)
[[params.authors]]
  id = "alex"
  name = "Alex Rivera"
  bio = "Cloud Architect & Open Source Enthusiast. Loves brewing coffee and automating everything with Go."
  avatar = "https://i.pravatar.cc/150?u=alex"
  github = "https://github.com/alex"
  linkedin = "https://linkedin.com/in/alex"

[[params.authors]]
  id = "sarah"
  name = "Sarah Miller"
  bio = "Frontend Engineer."
  avatar = "https://i.pravatar.cc/150?u=sarah"
  twitter = "https://twitter.com/sarah"

[[params.authors]]
  id = "budi"
  name = "Budi Santoso"
  bio = "DevOps Specialist specializing in Kubernetes and CI/CD pipelines. A strong advocate for infrastructure as code and reliable systems architecture. When not coding, Budi enjoys mountain hiking and photography, capturing the natural beauty of the Indonesian archipelago."
  avatar = "https://i.pravatar.cc/150?u=budi"

# Output Formats
[outputs]
  home = ["HTML", "RSS", "JSON"]
